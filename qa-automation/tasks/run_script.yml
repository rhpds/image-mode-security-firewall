---
# Reusable task list: copy a qa-automation/scripts script to the remote host,
# execute it with the fail_validation helper sourced, and capture output.
#
# Expected vars (set by the caller's loop):
#   script_name   – e.g. "module-2-solve" (without the "-<host>.sh" suffix)
#   scripts_path  – path to qa-automation/scripts directory (set in play vars)

- name: "{{ script_name }} – create temp directory"
  ansible.builtin.file:
    path: "/tmp/qa-scripts"
    state: directory
    mode: "0755"

- name: "{{ script_name }} – install fail_validation helper"
  ansible.builtin.copy:
    dest: "/tmp/qa-scripts/env.validation.sh"
    mode: "0644"
    content: |
      fail_validation() {
        echo "= FAIL VALIDATION BEGIN"
        if [ "$1" = "-" ] || { [ -z "$*" ] && [ ! -t 0 ]; }; then
          while IFS= read -r LINE; do
            echo "$LINE"
          done
        elif [ -n "$*" ]; then
          printf '%s\n' "$@"
        fi
        echo "= FAIL VALIDATION END"
        return 1
      }

- name: "{{ script_name }} – copy script"
  ansible.builtin.copy:
    src: "{{ scripts_path }}/{{ script_name }}-{{ inventory_hostname }}.sh"
    dest: "/tmp/qa-scripts/{{ script_name }}-{{ inventory_hostname }}.sh"
    mode: "0755"

- name: "{{ script_name }} – execute"
  ansible.builtin.shell: |
    set -e
    . /tmp/qa-scripts/env.validation.sh
    set -x
    . /tmp/qa-scripts/{{ script_name }}-{{ inventory_hostname }}.sh
  register: r_script_result
  failed_when: false

- name: "{{ script_name }} – write log"
  ansible.builtin.copy:
    dest: "/tmp/qa-scripts/{{ script_name }}-{{ inventory_hostname }}.log"
    content: >-
      {{ r_script_result.stdout | default('') }}{% if (r_script_result.stdout | default('')) and (r_script_result.stderr | default('')) %}{{ '\n' }}{% endif %}{{ r_script_result.stderr | default('') }}
    mode: "0644"

- name: "{{ script_name }} – capture validation failure"
  ansible.builtin.set_fact:
    _validation_failure: >-
      {{ (r_script_result.stdout | default(''))
        | regex_replace('(?ms).*^= FAIL VALIDATION BEGIN\n', '')
        | regex_replace('(?ms)\n?= FAIL VALIDATION END.*', '')
      }}
  when:
    - r_script_result.stdout is defined
    - '"= FAIL VALIDATION BEGIN" in r_script_result.stdout'

- name: "{{ script_name }} – write validation failure to job_info_dir"
  ansible.builtin.copy:
    content: "{{ _validation_failure }}"
    dest: "{{ job_info_dir }}/validation_failure.out"
  delegate_to: localhost
  become: false
  when:
    - _validation_failure is defined
    - job_info_dir is defined

- name: "{{ script_name }} – show output"
  ansible.builtin.debug:
    msg: "{{ r_script_result.stdout | default('') }}"
  when:
    - r_script_result.stdout | default('') | length > 0

- name: "{{ script_name }} – fail on validation error"
  ansible.builtin.fail:
    msg: "Validation failed for {{ script_name }}: {{ _validation_failure | default('') }}"
  when:
    - _validation_failure is defined

- name: "{{ script_name }} – fail on non-zero exit"
  ansible.builtin.fail:
    msg: "Script {{ script_name }}-{{ inventory_hostname }}.sh exited with rc={{ r_script_result.rc }}"
  when:
    - r_script_result.rc != 0
    - _validation_failure is not defined
