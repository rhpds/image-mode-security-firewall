# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: "Zero-Touch solve/validate buttons: Module 2 validates the specified firewall rule is active in the running bootc host's active zone; Module 3 validates that the Containerfile includes the correct firewall-offline-cmd directive."
    catalog_gap: ""
    design_overview: "This beginner-level lab teaches sysadmins and platform engineers how firewall rule management works differently in RHEL image mode (bootc) environments. Participants contrast two approaches — applying rules at runtime with firewalld versus baking them into a Containerfile at build time — to understand why build-time hardening is the durable, preferred practice for immutable image-based systems."
    module_summaries:
      - title: "Introduction to Firewall Rules in Image Mode"
        overview: "A conceptual orientation module that explains what RHEL image mode is and why runtime-only firewall changes don't persist across bootc upgrades. Participants read through a comparison of mutable vs. immutable systems and the runtime-vs-build-time approaches before moving to hands-on modules."
      - title: "Applying Firewall Rules on a Running Host"
        overview: "Participants use firewall-cmd on a pre-provisioned bootc host to list active rules, open a port in the active zone, and verify it with the solve/validate button. This module demonstrates the runtime approach and sets up the contrast with build-time hardening."
      - title: "Baking Firewall Rules into the Containerfile"
        overview: "Participants inspect a sample Containerfile and add a firewall-offline-cmd directive to open a port at build time, then validate their change. This module reinforces why build-time hardening is the correct pattern for image mode environments."
    rcars_overlap_pct: 80
    rcars_top_matches:
      - title: "Image Mode is the best mode"
        ci_name: "zt-rhelbu.zt-image-mode-rh1.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=zt-rhelbu.zt-image-mode-rh1.prod"
        relevance_score: 80
        why_it_fits: "This lab directly covers RHEL Image Mode (bootc) and includes firewalld offline configuration as a topic; the lab's emphasis on build-time hardening workflows including SCAP compliance, FAPolicyd, and firewalld aligns closely with the request's goal of baking firewall rules into images."
        workloads: []
      - title: "Introduction to image mode for Red Hat Enterprise Linux"
        ci_name: "zt-rhelbu.zt-image-mode-basics.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=zt-rhelbu.zt-image-mode-basics.prod"
        relevance_score: 73
        why_it_fits: "Covers RHEL image mode (bootc) fundamentals including Containerfile authoring for OS images; establishes foundational skills required before applying firewalld-specific hardening in an image mode context, but does not cover firewalld configuration at all."
        workloads: []
      - title: "The Definitive Red Hat Enterprise Linux 10 Hands-On Lab"
        ci_name: "published.hol-rhel10-cnv.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.hol-rhel10-cnv.prod"
        relevance_score: 64
        why_it_fits: "Covers both RHEL Image Mode (bootc) and firewalld management across multiple modules at fundamental and intermediate levels, but the build-time firewall hardening workflow is not combined into a single focused exercise."
        workloads:
          - role: "agnosticv_userdata_import"
            collection: "agnosticd.cloud_vm_workloads"
          - role: "asset_injector"
            collection: "rhpds.manage_host"
          - role: "control_user"
            collection: "agnosticd.cloud_vm_workloads"
          - role: "lab_setup"
            collection: "rhpds.hol_rhel10_automation"
    catalog_gap: "No existing catalog item offers a beginner-accessible lab that specifically isolates and contrasts applying firewall rules at runtime versus baking them into a bootc image at build time. The closest match covers image mode and firewalld but as one topic among many in a broad 3-hour intermediate lab."
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: ""
    agnosticv_base_ci: ""
    approved_by: ""
    rejections: []
