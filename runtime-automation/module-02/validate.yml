---
# VALIDATE — Module 2: Applying Firewall Rules on a Running Host
# Checks that TCP port 8080 is open in the active firewalld zone on the bootc VM.

- name: "Module 2 Validate"
  hosts: bastions
  gather_facts: false
  tasks:
    - name: List open ports on the bootc VM
      ansible.builtin.shell:
        cmd: ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 root@bootc-vm firewall-cmd --list-ports
      register: open_ports
      changed_when: false

    - name: Fail if 8080/tcp is not open
      ansible.builtin.fail:
        msg: >-
          Port 8080/tcp is not open in the active firewalld zone.
          Run: sudo firewall-cmd --add-port=8080/tcp
      when: "'8080/tcp' not in open_ports.stdout"
