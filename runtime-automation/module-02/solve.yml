---
# SOLVE — Module 2: Applying Firewall Rules on a Running Host
# Opens TCP port 8080 in the active firewalld zone on the bootc VM.
# Replicates: sudo firewall-cmd --add-port=8080/tcp

- name: "Module 2 Solve"
  hosts: bastions
  gather_facts: false
  tasks:
    - name: Open TCP port 8080 on the bootc VM
      ansible.builtin.shell:
        cmd: ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 root@bootc-vm firewall-cmd --add-port=8080/tcp
      changed_when: true
