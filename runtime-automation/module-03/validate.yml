---
# VALIDATE — Module 3: Baking Firewall Rules into the Containerfile
# Verifies that 8443/tcp is open (baked into the image) on the bootc VM
# after the upgrade and reboot.

- name: "Module 3 Validate"
  hosts: bastions
  gather_facts: false
  tasks:
    - name: List open ports on the bootc VM
      ansible.builtin.shell:
        cmd: ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 root@bootc-vm firewall-cmd --list-ports
      register: open_ports
      changed_when: false

    - name: Fail if 8443/tcp is not open
      ansible.builtin.fail:
        msg: >-
          Port 8443/tcp is not open on the bootc VM. Ensure the Containerfile
          contains 'RUN firewall-offline-cmd --add-port=8443/tcp' after
          'RUN systemctl enable firewalld', then rebuild, push, and redeploy.
      when: "'8443/tcp' not in open_ports.stdout"
