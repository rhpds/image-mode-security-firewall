---
# SOLVE — Module 3: Baking Firewall Rules into the Containerfile
# Adds RUN firewall-offline-cmd --add-port=8443/tcp to the Containerfile,
# rebuilds and pushes the image, then upgrades and reboots the bootc VM.

- name: "Module 3 Solve"
  hosts: bastions
  gather_facts: false
  vars:
    containerfile: "{{ ansible_env.HOME }}/examples/Containerfile"
    image_ref: "registry-{{ guid }}.{{ domain }}/base"
  tasks:
    - name: Add firewall-offline-cmd rule to Containerfile
      ansible.builtin.lineinfile:
        path: "{{ containerfile }}"
        line: "RUN firewall-offline-cmd --add-port=8443/tcp"
        insertafter: "^RUN systemctl enable firewalld"
        state: present

    - name: Build the bootc image
      ansible.builtin.shell:
        cmd: "podman build --tag {{ image_ref }} --file {{ containerfile }} {{ ansible_env.HOME }}/examples"
      changed_when: true

    - name: Push the image to the local registry
      ansible.builtin.shell:
        cmd: "podman push {{ image_ref }}"
      changed_when: true

    - name: Stage bootc upgrade on the bootc VM
      ansible.builtin.shell:
        cmd: ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@bootc-vm bootc upgrade
      changed_when: true

    - name: Reboot the bootc VM
      ansible.builtin.shell:
        cmd: ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@bootc-vm systemctl reboot
      changed_when: true
      failed_when: false  # SSH exits non-zero when the host disconnects on reboot

    - name: Wait for the bootc VM to come back up
      ansible.builtin.wait_for:
        host: bootc-vm
        port: 22
        delay: 15
        timeout: 120
        state: started
